<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">

  <title>Gerador de Ingresso para Conferência</title>
</head>

<body>

  <img src="assets/images/logo-full.svg" alt="logo" id="logo-full">
  
  <main id="main">
    <span>
      <h1>Your Journey to Coding Conf 2025 Starts Here!</h1>
      <h2> Secure your spot at next year's biggest coding conference.</h2>
    </span>
    <div id="texto-alterado"></div>
<!-- Form starts -->
    <form>
      <img src="assets/images/logo-full.svg" alt="logo" class="logo">
      <div class="dados">
        <label for="upload">Upload Avatar</label> <br>
        <input type="file" placeholder="Drag and drop or click to upload" class="upload-imagem">
        <p class="mensagem-upload">Drag and drop or click to upload</p><br>
        <img src="assets/images/icon-info.svg" alt="info" id="info-img">
        <p id="upload-p">Upload your photo (JPG or PNG, max size: 500KB).</p>
      </div>

      <div class="dados">
        <label for="nome">Full Name</label> <br>
        <input type="text" id="nome" required placeholder="John Doe">
      </div>
      <div class="dados">
        <label for="email">Email Address</label> <br>
        <input type="email" id="email" required placeholder="example@email.com">
      </div>
      <div class="dados">
        <label for="username">GitHub Username</label> <br>
        <input type="text" id="username" required placeholder="@yourusername">
      </div>

    </form>
    <button id="gerar-btn">Generate My Ticket</button>

  </main>

  <script src="script.js"></script>
</body>

</html>
